<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Baramu</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237b1f1f'/><text x='50' y='68' text-anchor='middle' font-size='52' font-weight='800' fill='white' font-family='system-ui'>D</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <div class="wrap">
    <section class="section" id="admin-root"><div class="loading">Memuat…</div></section>
  </div>
</main>

<script type="module">
import { renderChrome, formatRupiah, escapeHtml } from '/js/app.js';
await renderChrome('');

const root = document.getElementById('admin-root');
const TOKEN_KEY = 'dimsum_admin_token';
let token = sessionStorage.getItem(TOKEN_KEY) || '';

async function adminApi(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json', 'x-admin-token': token, ...(opts.headers || {}) },
    ...opts,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { sessionStorage.removeItem(TOKEN_KEY); token = ''; showLogin('Token salah atau kedaluwarsa.'); throw new Error('unauthorized'); }
  if (!res.ok) throw new Error(data.error || 'Terjadi kesalahan.');
  return data;
}

function showLogin(msg = '') {
  root.innerHTML = `
  <div class="admin-login">
    <h1>🔐 Admin</h1>
    ${msg ? `<div class="alert alert-error">${escapeHtml(msg)}</div>` : ''}
    <div class="form-group">
      <label for="token">Token Admin</label>
      <input id="token" type="password" placeholder="Masukkan ADMIN_TOKEN" autocomplete="off">
      <div class="form-hint">Token ini ada di file .env server (ADMIN_TOKEN).</div>
    </div>
    <button class="btn btn-primary btn-block" id="btn-login">Masuk</button>
  </div>`;
  document.getElementById('btn-login').onclick = () => {
    token = document.getElementById('token').value.trim();
    if (!token) return;
    sessionStorage.setItem(TOKEN_KEY, token);
    showDashboard();
  };
}

const STATUSES = ['menunggu_pembayaran', 'menunggu_konfirmasi', 'diproses', 'siap', 'selesai', 'dibatalkan'];
const STATUS_ID = { menunggu_pembayaran: 'Menunggu pembayaran', menunggu_konfirmasi: 'Menunggu konfirmasi', diproses: 'Diproses', siap: 'Siap diambil / dikirim', selesai: 'Selesai', dibatalkan: 'Dibatalkan' };

async function showDashboard() {
  root.innerHTML = `
  <h1>📊 Dashboard Admin</h1>
  <div class="chips" style="margin-bottom:16px">
    <button class="chip active" data-tab="orders">Pesanan</button>
    <button class="chip" data-tab="products">Produk</button>
    <button class="chip" data-tab="settings">Pengaturan</button>
    <button class="chip" data-tab="logout">Keluar</button>
  </div>
  <div id="tab-body"><div class="loading">Memuat…</div></div>`;

  const body = document.getElementById('tab-body');
  root.querySelector('.chips').addEventListener('click', async (e) => {
    const tab = e.target.closest('[data-tab]');
    if (!tab) return;
    if (tab.dataset.tab === 'logout') { sessionStorage.removeItem(TOKEN_KEY); token = ''; showLogin(); return; }
    root.querySelectorAll('.chips .chip').forEach((c) => c.classList.toggle('active', c === tab));
    if (tab.dataset.tab === 'orders') renderOrders(body);
    if (tab.dataset.tab === 'products') renderProducts(body);
    if (tab.dataset.tab === 'settings') renderSettings(body);
  });
  renderOrders(body);
}

async function renderOrders(body) {
  body.innerHTML = '<div class="loading">Memuat pesanan…</div>';
  try {
    const { orders } = await adminApi('/api/admin/orders');
    if (!orders.length) { body.innerHTML = '<div class="empty"><p>Belum ada pesanan.</p></div>'; return; }
    body.innerHTML = `
    <div style="overflow-x:auto"><table class="admin-table">
      <tr><th>Order</th><th>Customer</th><th>Total</th><th>Bayar</th><th>Status</th><th>Aksi</th></tr>
      ${orders.map((o) => `
      <tr>
        <td><strong>#${escapeHtml(o.order_number)}</strong><br><small>${escapeHtml((o.created_at || '').slice(0, 16).replace('T', ' '))}</small></td>
        <td>${escapeHtml(o.customer_name)}<br><small>${escapeHtml(o.customer_phone)}</small></td>
        <td>${formatRupiah(o.total)}</td>
        <td><small>${escapeHtml(o.payment_method || 'COD')}</small>${o.payment_proof ? `<br><a href="${escapeHtml(o.payment_proof)}" target="_blank" rel="noopener"><img src="${escapeHtml(o.payment_proof)}" alt="Bukti" style="max-width:64px;border-radius:6px;margin-top:4px"></a>` : ''}</td>
        <td><span class="status-pill">${escapeHtml(o.status_label)}</span></td>
        <td><select data-order="${o.id}" aria-label="Ubah status">
          ${STATUSES.map((s) => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${STATUS_ID[s]}</option>`).join('')}
        </select></td>
      </tr>`).join('')}
    </table></div>
    <p class="form-hint">Ubah "Menunggu pembayaran" → "Diproses" setelah bukti transfer diverifikasi. "Dibatalkan" mengembalikan stok otomatis.</p>`;
    body.querySelectorAll('[data-order]').forEach((sel) => {
      sel.addEventListener('change', async () => {
        try {
          await adminApi(`/api/admin/orders/${sel.dataset.order}/status`, {
            method: 'PATCH', body: JSON.stringify({ status: sel.value }),
          });
          renderOrders(body);
        } catch (e) { alert(e.message); }
      });
    });
  } catch (e) { if (e.message !== 'unauthorized') body.innerHTML = `<div class="alert alert-error">${escapeHtml(e.message)}</div>`; }
}

const PRODUCT_CATEGORIES = ['dimsum', 'olahan-ayam', 'paket', 'lainnya'];

async function uploadImage(file) {
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch('/api/admin/upload', {
    method: 'POST',
    headers: { 'x-admin-token': token },
    body: fd,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { sessionStorage.removeItem(TOKEN_KEY); token = ''; showLogin('Token salah atau kedaluwarsa.'); throw new Error('unauthorized'); }
  if (!res.ok) throw new Error(data.error || 'Upload gagal.');
  return data.path;
}

async function renderProducts(body) {
  body.innerHTML = '<div class="loading">Memuat produk…</div>';
  try {
    const { products } = await adminApi('/api/admin/products');
    body.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="margin:0">Produk (${products.length})</h2>
      <button class="btn btn-primary" id="btn-add-product">＋ Tambah Produk</button>
    </div>
    <div style="overflow-x:auto"><table class="admin-table">
      <tr><th>Produk</th><th>Harga</th><th>Stok</th><th>Aktif</th><th></th></tr>
      ${products.map((p) => `
      <tr>
        <td><strong>${escapeHtml(p.name)}</strong><br><small>${escapeHtml(p.category)} · ${escapeHtml(p.slug)}</small></td>
        <td>${formatRupiah(p.price)}</td>
        <td>${p.stock_quantity} <small>(${escapeHtml(p.stock_status)})</small></td>
        <td>${p.is_active ? '✅' : '❌'}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-sm" data-edit="${p.id}">Edit</button>
          <button class="btn btn-sm" data-del="${p.id}" data-name="${escapeHtml(p.name)}" style="color:#b00">Hapus</button>
        </td>
      </tr>`).join('')}
    </table></div>
    <p class="form-hint">Nonaktifkan produk untuk menyembunyikannya dari katalog tanpa menghapus.</p>`;
    document.getElementById('btn-add-product').onclick = () => renderProductForm(body, null);
    body.querySelectorAll('[data-edit]').forEach((b) => {
      b.onclick = () => {
        const p = products.find((x) => String(x.id) === b.dataset.edit);
        renderProductForm(body, p);
      };
    });
    body.querySelectorAll('[data-del]').forEach((b) => {
      b.onclick = async () => {
        if (!confirm(`Hapus "${b.dataset.name}" permanen?`)) return;
        try {
          await adminApi(`/api/admin/products/${b.dataset.del}`, { method: 'DELETE' });
          renderProducts(body);
        } catch (e) { alert(e.message); }
      };
    });
  } catch (e) { if (e.message !== 'unauthorized') body.innerHTML = `<div class="alert alert-error">${escapeHtml(e.message)}</div>`; }
}

function renderProductForm(body, p) {
  const isNew = !p;
  p = p || { name: '', category: 'dimsum', price: 0, stock_quantity: 0, description: '', image: '', badge: '', is_featured: 0, is_active: 1 };
  body.innerHTML = `
  <button class="btn btn-sm" id="btn-back" style="margin-bottom:12px">← Kembali</button>
  <h2 style="margin-top:0">${isNew ? 'Tambah Produk' : 'Edit Produk'}</h2>
  <div class="form-group"><label>Nama produk *</label><input id="f-name" value="${escapeHtml(p.name)}" maxlength="255"></div>
  <div class="form-group"><label>Kategori</label><select id="f-category">
    ${PRODUCT_CATEGORIES.map((c) => `<option value="${c}" ${c === p.category ? 'selected' : ''}>${c}</option>`).join('')}
  </select></div>
  <div class="form-group"><label>Harga (Rp) *</label><input id="f-price" type="number" min="0" step="500" value="${p.price}"></div>
  <div class="form-group"><label>Stok *</label><input id="f-stock" type="number" min="0" value="${p.stock_quantity}"></div>
  <div class="form-group"><label>Deskripsi</label><textarea id="f-desc" rows="3">${escapeHtml(p.description || '')}</textarea></div>
  <div class="form-group"><label>Foto produk</label>
    <div id="f-preview" style="margin-bottom:8px">${p.image ? `<img src="${escapeHtml(p.image)}" alt="" style="max-width:160px;border-radius:8px">` : '<span class="form-hint">Belum ada foto</span>'}</div>
    <input id="f-file" type="file" accept="image/jpeg,image/png,image/webp">
    <div class="form-hint">JPG/PNG/WebP, maksimal 2 MB. Foto langsung ter-upload saat dipilih.</div>
    <input id="f-image" type="hidden" value="${escapeHtml(p.image || '')}">
  </div>
  <div class="form-group"><label>Badge (opsional, mis. "Best Seller", "Baru")</label><input id="f-badge" value="${escapeHtml(p.badge || '')}" maxlength="50"></div>
  <div class="form-group"><label style="display:flex;gap:8px;align-items:center"><input id="f-featured" type="checkbox" ${p.is_featured ? 'checked' : ''} style="width:22px;height:22px"> Produk unggulan</label></div>
  <div class="form-group"><label style="display:flex;gap:8px;align-items:center"><input id="f-active" type="checkbox" ${p.is_active ? 'checked' : ''} style="width:22px;height:22px"> Tampilkan di katalog</label></div>
  <button class="btn btn-primary btn-block" id="f-save">${isNew ? 'Tambah Produk' : 'Simpan Perubahan'}</button>
  <div id="f-msg" style="margin-top:8px"></div>`;

  document.getElementById('btn-back').onclick = () => renderProducts(body);

  document.getElementById('f-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const msg = document.getElementById('f-msg');
    msg.textContent = 'Meng-upload foto…';
    try {
      const path = await uploadImage(file);
      document.getElementById('f-image').value = path;
      document.getElementById('f-preview').innerHTML = `<img src="${escapeHtml(path)}" alt="" style="max-width:160px;border-radius:8px">`;
      msg.textContent = 'Foto ter-upload.';
    } catch (err) { msg.innerHTML = `<span style="color:#b00">${escapeHtml(err.message)}</span>`; }
  });

  document.getElementById('f-save').onclick = async () => {
    const msg = document.getElementById('f-msg');
    const payload = {
      name: document.getElementById('f-name').value.trim(),
      category: document.getElementById('f-category').value,
      price: Number(document.getElementById('f-price').value),
      stock_quantity: Number(document.getElementById('f-stock').value),
      description: document.getElementById('f-desc').value.trim(),
      image: document.getElementById('f-image').value,
      badge: document.getElementById('f-badge').value.trim(),
      is_featured: document.getElementById('f-featured').checked ? 1 : 0,
      is_active: document.getElementById('f-active').checked ? 1 : 0,
    };
    if (payload.name.length < 2) { msg.innerHTML = '<span style="color:#b00">Nama produk wajib diisi.</span>'; return; }
    msg.textContent = 'Menyimpan…';
    try {
      if (isNew) {
        await adminApi('/api/admin/products', { method: 'POST', body: JSON.stringify(payload) });
      } else {
        await adminApi(`/api/admin/products/${p.id}`, { method: 'PATCH', body: JSON.stringify(payload) });
      }
      renderProducts(body);
    } catch (err) { msg.innerHTML = `<span style="color:#b00">${escapeHtml(err.message)}</span>`; }
  };
}

async function renderSettings(body) {
  body.innerHTML = '<div class="loading">Memuat pengaturan…</div>';
  try {
    const { settings } = await adminApi('/api/admin/settings');
    const pm = (() => { try { return JSON.parse(settings.payment_methods || '[]'); } catch { return []; } })();
    body.innerHTML = `
    <div class="form-group"><label>Nama Toko</label><input id="s-shop" value="${escapeHtml(settings.shop_name || '')}"></div>
    <div class="form-group"><label>WhatsApp Admin (628…)</label><input id="s-wa" value="${escapeHtml(settings.admin_whatsapp || '')}"><div class="form-hint">Dipakai untuk notifikasi pesanan & tombol tanya-tanya.</div></div>
    <div class="form-group"><label>Alamat Pickup</label><textarea id="s-addr">${escapeHtml(settings.pickup_address || '')}</textarea></div>
    <div class="form-group"><label>Metode Pembayaran (pisahkan koma)</label><input id="s-pay" value="${escapeHtml(pm.join(', '))}"></div>
    <div class="form-group"><label>Rekening Tujuan Transfer</label><textarea id="s-bank" rows="3" placeholder="Satu rekening per baris, contoh:&#10;BCA 1234567890 a.n. Nama Kamu&#10;Mandiri 0987654321 a.n. Nama Kamu">${escapeHtml(settings.payment_bank_accounts || '')}</textarea><div class="form-hint">Tampil di halaman pembayaran customer yang pilih Transfer.</div></div>
    <div class="form-group"><label>Kode QRIS</label>
      <div id="s-qris-prev" style="margin-bottom:8px">${settings.payment_qris_image ? `<img src="${escapeHtml(settings.payment_qris_image)}" alt="QRIS" style="max-width:160px;border-radius:8px">` : '<span class="form-hint">Belum ada QRIS</span>'}</div>
      <input id="s-qris-file" type="file" accept="image/jpeg,image/png,image/webp">
      <input id="s-qris" type="hidden" value="${escapeHtml(settings.payment_qris_image || '')}">
      <div class="form-hint">Upload gambar QRIS (JPG/PNG/WebP, max 2 MB).</div>
    </div>
    <div class="form-group"><label>Ongkir Delivery (Rp)</label><input id="s-fee" type="number" min="0" value="${escapeHtml(settings.delivery_fee || '0')}"></div>
    <button class="btn btn-primary" id="s-save">Simpan Pengaturan</button>
    <div id="s-msg" style="margin-top:8px"></div>`;
    document.getElementById('s-qris-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const msg = document.getElementById('s-msg');
      msg.textContent = 'Meng-upload QRIS…';
      try {
        const path = await uploadImage(file);
        document.getElementById('s-qris').value = path;
        document.getElementById('s-qris-prev').innerHTML = `<img src="${escapeHtml(path)}" alt="QRIS" style="max-width:160px;border-radius:8px">`;
        msg.textContent = 'QRIS ter-upload. Jangan lupa tekan Simpan Pengaturan.';
      } catch (err) { msg.innerHTML = `<span style="color:#b00">${escapeHtml(err.message)}</span>`; }
    });
    document.getElementById('s-save').onclick = async () => {
      try {
        await adminApi('/api/admin/settings', { method: 'PUT', body: JSON.stringify({
          shop_name: document.getElementById('s-shop').value,
          admin_whatsapp: document.getElementById('s-wa').value,
          pickup_address: document.getElementById('s-addr').value,
          payment_methods: document.getElementById('s-pay').value,
          payment_bank_accounts: document.getElementById('s-bank').value,
          payment_qris_image: document.getElementById('s-qris').value,
          delivery_fee: document.getElementById('s-fee').value,
        })});
        alert('Pengaturan tersimpan.');
      } catch (e) { alert(e.message); }
    };
  } catch (e) { if (e.message !== 'unauthorized') body.innerHTML = `<div class="alert alert-error">${escapeHtml(e.message)}</div>`; }
}

if (token) {
  try { await adminApi('/api/admin/settings'); showDashboard(); }
  catch { showLogin(); }
} else showLogin();
</script>
</body>
</html>
