<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keranjang — Dimsum Enak</title>
<meta name="description" content="Lihat dan ubah isi keranjang belanjamu sebelum checkout.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237b1f1f'/><text x='50' y='68' text-anchor='middle' font-size='52' font-weight='800' fill='white' font-family='system-ui'>D</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <div class="wrap">
    <section class="section">
      <h1 style="margin:0 0 16px">🛒 Keranjang</h1>
      <div id="cart-wrap"><div class="loading">Memuat keranjang…</div></div>
    </section>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
import { renderChrome, formatRupiah, productImage, escapeHtml } from '/js/app.js';
import { cartDetailed, setQty, removeFromCart } from '/js/cart.js';

await renderChrome('keranjang');
const wrap = document.getElementById('cart-wrap');

async function render() {
  let items;
  try {
    items = await cartDetailed();
  } catch (e) {
    wrap.innerHTML = `<div class="alert alert-error">${escapeHtml(e.message)}</div>`;
    return;
  }
  if (!items.length) {
    wrap.innerHTML = `<div class="empty"><p>Keranjang masih kosong.</p><a class="btn btn-primary" href="/katalog">Lihat Katalog</a></div>`;
    return;
  }
  const total = items.reduce((n, i) => n + i.subtotal, 0);
  wrap.innerHTML = `
    ${items.map((i) => `
    <div class="cart-item">
      <div class="cart-thumb">${productImage(i, i.name)}</div>
      <div class="cart-info">
        <p class="cart-name">${escapeHtml(i.name)}</p>
        <p class="cart-price">${formatRupiah(i.price)} / pcs</p>
        <div class="qty-mini">
          <button data-dec="${i.id}" aria-label="Kurangi">−</button>
          <strong>${i.qty}</strong>
          <button data-inc="${i.id}" data-max="${i.stock_quantity}" aria-label="Tambah">+</button>
        </div>
        ${i.truncated ? `<p class="form-error">Disesuaikan ke stok: ${i.stock_quantity} pcs.</p>` : ''}
      </div>
      <div style="text-align:right">
        <div class="cart-sub">${formatRupiah(i.subtotal)}</div>
        <button class="cart-remove" data-del="${i.id}">Hapus</button>
      </div>
    </div>`).join('')}
    <div class="cart-total-box">
      <div class="total-row grand"><span>Total</span><span>${formatRupiah(total)}</span></div>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">
        <a class="btn btn-primary btn-block" href="/checkout">Lanjut ke Pemesanan →</a>
        <a class="btn btn-muted btn-block" href="/katalog">← Tambah Produk Lain</a>
      </div>
    </div>`;
}

wrap.addEventListener('click', async (e) => {
  const dec = e.target.closest('[data-dec]');
  const inc = e.target.closest('[data-inc]');
  const del = e.target.closest('[data-del]');
  if (dec) {
    const items = await cartDetailed();
    const it = items.find((x) => x.id === Number(dec.dataset.dec));
    setQty(Number(dec.dataset.dec), (it ? it.qty : 1) - 1);
  } else if (inc) {
    const id = Number(inc.dataset.inc);
    const max = Number(inc.dataset.max);
    const items = await cartDetailed();
    const it = items.find((x) => x.id === id);
    const cur = it ? it.qty : 0;
    if (cur + 1 > max) { alert(`Stok tersedia ${max} pcs.`); return; }
    setQty(id, cur + 1);
  } else if (del) {
    if (confirm('Hapus produk ini dari keranjang?')) removeFromCart(Number(del.dataset.del));
    else return;
  } else return;
  render();
});

await render();
</script>
</body>
</html>
