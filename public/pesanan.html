<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesanan Berhasil — Dimsum Enak</title>
<meta name="description" content="Pesananmu berhasil dibuat. Kirim detail pesanan ke admin via WhatsApp.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237b1f1f'/><text x='50' y='68' text-anchor='middle' font-size='52' font-weight='800' fill='white' font-family='system-ui'>D</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main>
  <div class="wrap">
    <section class="section">
      <div id="order-wrap"><div class="loading">Memuat pesanan…</div></div>
    </section>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
import { api, renderChrome, formatRupiah, escapeHtml, loadSettings } from '/js/app.js';

await renderChrome('keranjang');
const wrap = document.getElementById('order-wrap');
const params = new URLSearchParams(location.search);
const orderNumber = params.get('order');
const phone = params.get('phone') || '';

if (!orderNumber) {
  wrap.innerHTML = '<div class="alert alert-error">Nomor pesanan tidak ditemukan.</div>';
} else {
  try {
    const q = phone ? `?phone=${encodeURIComponent(phone)}` : '';
    const { order, items, whatsapp_url } = await api('/api/orders/' + encodeURIComponent(orderNumber) + q);
    const settings = await loadSettings();
    const isDelivery = order.fulfillment_method === 'delivery';
    const needPay = order.payment_method === 'Transfer' && order.status === 'menunggu_pembayaran';
    const qris = settings.payment_qris_image || '';
    const accounts = (settings.payment_bank_accounts || '').split('\n').map((s) => s.trim()).filter(Boolean);

    wrap.innerHTML = `
    <div class="alert alert-success">✅ Pesanan berhasil dibuat! Simpan nomor pesanan di bawah ini.</div>
    <div class="order-id">#${escapeHtml(order.order_number)}</div>
    <div style="text-align:center;margin-bottom:16px"><span class="status-pill">${escapeHtml(order.status_label)}</span></div>

    <div class="summary-box">
      <h3>Detail Pesanan</h3>
      <div class="kv"><span>Nama</span><span>${escapeHtml(order.customer_name)}</span></div>
      <div class="kv"><span>WhatsApp</span><span>${escapeHtml(order.customer_phone)}</span></div>
      <div class="kv"><span>Metode</span><span>${isDelivery ? 'Delivery 🛵' : 'Pickup 🏃'}</span></div>
      ${isDelivery ? `<div class="kv"><span>Alamat</span><span>${escapeHtml(order.address)}</span></div>` : `<div class="kv"><span>Lokasi pickup</span><span>${escapeHtml(settings.pickup_address || '-')}</span></div>`}
      <div class="kv"><span>Pembayaran</span><span>${escapeHtml(order.payment_method)}</span></div>
      ${order.notes ? `<div class="kv"><span>Catatan</span><span>${escapeHtml(order.notes)}</span></div>` : ''}
    </div>

    <div class="summary-box">
      <h3>Produk</h3>
      ${items.map((i) => `<div class="kv"><span>${escapeHtml(i.product_name)} × ${i.quantity}</span><span>${formatRupiah(i.subtotal)}</span></div>`).join('')}
      <div class="kv"><span>Subtotal</span><span>${formatRupiah(order.subtotal)}</span></div>
      ${order.delivery_fee > 0 ? `<div class="kv"><span>Ongkir</span><span>${formatRupiah(order.delivery_fee)}</span></div>` : ''}
      <div class="total-row grand"><span>Total</span><span>${formatRupiah(order.total)}</span></div>
    </div>

    ${needPay ? `
    <div class="summary-box" style="border:2px solid #7b1f1f">
      <h3>💳 Lakukan Pembayaran</h3>
      <p>Transfer <strong>${formatRupiah(order.total)}</strong> ke salah satu tujuan berikut:</p>
      ${qris ? `<div style="text-align:center;margin:12px 0"><img src="${escapeHtml(qris)}" alt="QRIS" style="max-width:220px;border-radius:8px"><div class="form-hint">Scan QRIS di atas</div></div>` : ''}
      ${accounts.length ? `<div class="kv" style="display:block">${accounts.map((a) => `<div style="padding:6px 0;border-bottom:1px dashed #ddd"><strong>${escapeHtml(a)}</strong></div>`).join('')}</div>` : ''}
      ${order.payment_proof ? `
        <div class="alert alert-success">✅ Bukti pembayaran terkirim. Menunggu verifikasi admin.</div>
        <div style="text-align:center"><img src="${escapeHtml(order.payment_proof)}" alt="Bukti pembayaran" style="max-width:200px;border-radius:8px"></div>
      ` : `
      <div class="form-group" style="margin-top:12px">
        <label for="bukti">Upload Bukti Transfer</label>
        <input id="bukti" type="file" accept="image/jpeg,image/png,image/webp">
        <div class="form-hint">Foto/screenshot bukti transfer (JPG/PNG/WebP, max 2 MB).</div>
      </div>
      <button class="btn btn-primary btn-block" id="btn-bukti">Kirim Bukti Pembayaran</button>
      <div id="bukti-msg" style="margin-top:8px"></div>`}
    </div>` : ''}

    <div class="info-box">
      <h3>💬 Butuh bantuan?</h3>
      <p>Ada pertanyaan soal pesananmu? Hubungi admin via WhatsApp.</p>
      <a class="btn btn-wa btn-block" href="${escapeHtml(whatsapp_url)}" target="_blank" rel="noopener">💬 Chat Admin via WhatsApp</a>
    </div>

    <a class="btn btn-muted btn-block" href="/katalog">← Kembali Belanja</a>`;

    const btnBukti = document.getElementById('btn-bukti');
    if (btnBukti) {
      btnBukti.onclick = async () => {
        const file = document.getElementById('bukti').files[0];
        const msg = document.getElementById('bukti-msg');
        if (!file) { msg.innerHTML = '<span style="color:#b00">Pilih file bukti dulu.</span>'; return; }
        msg.textContent = 'Meng-upload…';
        btnBukti.disabled = true;
        try {
          const fd = new FormData();
          fd.append('file', file);
          fd.append('phone', phone);
          const res = await fetch('/api/orders/' + encodeURIComponent(orderNumber) + '/proof', { method: 'POST', body: fd });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Upload gagal.');
          location.reload();
        } catch (e) {
          msg.innerHTML = `<span style="color:#b00">${escapeHtml(e.message)}</span>`;
          btnBukti.disabled = false;
        }
      };
    }
  } catch (e) {
    wrap.innerHTML = `<div class="alert alert-error">${escapeHtml(e.message)}</div>`;
  }
}
</script>
</body>
</html>
